<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" type="image/x-icon" href="../../favicon.ico">
<title>{{.Title}} | nealpatel</title>
<style>
{{stylesheet}}
  :root { --page-width: 60em; }
  body { max-width: var(--page-width); margin: 3rem auto; padding: 0 1.5rem; }
  h1 { margin-bottom: 0; }
  .image-grid { display: grid; grid-template-rows: auto; grid-gap: 1em; grid-template-columns: {{.GridCSSAttr}}; }
  .image-grid img { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<main class="markdown">
<h1>{{.Title}}</h1>
<p>{{.Date}} <span class="home">[<a href="/">home</a>]</span></p>
<br>
<p>intended viewing grid: {{.Grid}}{{if .Zoom}} [<a id="zoomie">zoom</a>]{{end}}</p>
<div class="image-grid">
{{range .Images}}<a href="{{.}}"><img src="{{.}}" width="auto" height="auto" alt="{{.}}"></a>
{{end}}</div>
<br>
<p>(c) 2025 neal patel</p>
</main>
<script>
var z = document.getElementById("zoomie");
if (z) z.onclick = function () {
  if (document.body.style.zoom === "1.5") {
    document.body.style.zoom = 1.0;
    z.textContent = "zoom";
  } else {
    document.body.style.zoom = 1.5;
    z.textContent = "unzoom";
  }
};
</script>
</body>
</html>
