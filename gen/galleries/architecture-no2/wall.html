<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" type="image/x-icon" href="../../favicon.ico">
<title>architecture #2 | nealpatel</title>
<style>
:root {
  color-scheme: light;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: #2d2d2d;
  background: #fff;
  line-height: 1.5;
}
.markdown {
  color: #2d2d2d;
  white-space: normal;
  overflow-wrap: anywhere;
}
.markdown > :first-child {
  margin-top: 0;
}
.markdown > :last-child {
  margin-bottom: 0;
}
.markdown h1,
.markdown h2,
.markdown h3,
.markdown h4,
.markdown h5,
.markdown h6 {
  margin: 1.25em 0 0.5em;
}
.markdown ol,
.markdown ul {
  padding-left: 2rem;
}
.markdown blockquote {
  border-left: 0.25rem solid #8a8a8a;
  color: #3b3b3b;
  margin-left: 0;
  padding-left: 1rem;
}
.markdown a {
  color: #0e7187;
}
.markdown code {
  background: transparent;
  color: #008000;
  font-family: inherit;
  padding: 0.08em 0.25em;
}
.markdown pre {
  background: #ffffe1;
  color: #000;
  overflow-x: auto;
  padding: 0.75rem;
  white-space: pre;
}
.markdown pre code,
.markdown pre code * {
  background: transparent;
  color: #000;
  padding: 0;
}
.markdown table {
  border-collapse: collapse;
  display: block;
  overflow-x: auto;
}
.markdown th,
.markdown td {
  border: 1px solid #8a8a8a;
  padding: 0.35rem 0.6rem;
}
.markdown math[display="block"] {
  display: block;
  margin: 1em 0;
  overflow-x: auto;
}

  :root { --page-width: 60em; }
  body { max-width: var(--page-width); margin: 3rem auto; padding: 0 1.5rem; }
  h1 { margin-bottom: 0; }
  .image-grid { display: grid; grid-template-rows: auto; grid-gap: 1em; grid-template-columns: repeat(auto-fit, minmax(calc(var(--page-width) / 4), 0.5fr)); }
  .image-grid img { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<main class="markdown">
<h1>architecture #2</h1>
<p>2025-10-19 <span class="home">[<a href="/">home</a>]</span></p>
<br>
<p>intended viewing grid: 1x1</p>
<div class="image-grid">
<a href="p3.jpg"><img src="p3.jpg" width="auto" height="auto" alt="p3.jpg"></a>
</div>
<br>
<p>(c) 2025 neal patel</p>
</main>
<script>
var z = document.getElementById("zoomie");
if (z) z.onclick = function () {
  if (document.body.style.zoom === "1.5") {
    document.body.style.zoom = 1.0;
    z.textContent = "zoom";
  } else {
    document.body.style.zoom = 1.5;
    z.textContent = "unzoom";
  }
};
</script>
</body>
</html>
